version: 2
project_name: readmit

builds:
  - id: readmit
    main: ./cmd/readmit
    binary: readmit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: readmit
    ids: [readmit]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - THIRD_PARTY_NOTICES.md
      - licenses/*
      - docs/dictionary-provenance.md
      - docs/case-bundle.md
      - docs/import.md
      - docs/index.md
      - docs/mapping.md
      - docs/project.md
      - docs/project-lifecycle.md
      - docs/backup.md
      - docs/license.md
      - docs/secret.md
      - docs/protect.md
      - docs/target.md
      - docs/listen.md
      - docs/collect.md
      - docs/replay.md
      - docs/run-bundle.md
      - docs/test-runner.md
      - docs/durable-runs.md
      - docs/observe.md
      - docs/test-spec.md
      - docs/test-result.md
      - docs/redact.md
      - docs/diff.md
      - docs/report.md

      - docs/diagnose.md
      - docs/selectors.md

      - docs/synth.md
      - docs/synth-v1-vector.md
      - testdata/README.md
      - testdata/fixtures/*
      - src: internal/dictionary/fields-v251.json
        dst: dictionary
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  # Publication is a separate job after native tests of these exact archives.
  disable: true
