version: 2
project_name: readmit

builds:
  - id: readmit
    main: ./cmd/readmit
    binary: readmit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/bharm16/readmit/internal/engine.version={{.Version}}

archives:
  - id: readmit
    ids: [readmit]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - THIRD_PARTY_NOTICES.md
      - licenses/*
      - docs/dictionary-provenance.md
      - docs/profile-packs.md
      - docs/profile-extraction-v5-receipt.json
      - docs/profile-redistribution-review.md
      - docs/profile-source-map.json
      - docs/profile-coverage-gaps.json
      - docs/profile-library.md
      - docs/local-profiles.md
      - docs/profile-versions.md
      - docs/profile-packages.md
      - docs/case-bundle.md
      - docs/import.md
      - docs/source.md
      - docs/index.md
      - docs/corpus.md
      - docs/adversarial-acceptance.md
      - docs/mapping.md
      - docs/project.md
      - docs/project-lifecycle.md
      - docs/backup.md
      - docs/upgrade.md
      - docs/license.md
      - docs/license-v2.md
      - docs/billing.md
      - docs/commercial-administration.md
      - docs/commercial-terms.md
      - docs/secret.md
      - docs/protect.md
      - docs/target.md
      - docs/listen.md
      - docs/collect.md
      - docs/replay.md
      - docs/run-bundle.md
      - docs/test-runner.md
      - docs/connected-tests.md
      - docs/connected-transports.md
      - docs/typed-datasets.md
      - docs/connected-runtime.md
      - docs/connected-lifecycle.md
      - docs/observation-intervals.md
      - docs/test-isolation.md
      - docs/fhir-r4.md
      - docs/smart-backend.md
      - docs/fhir-rest.md
      - docs/fhir-validation.md
      - docs/connected-fhir.md
      - docs/connected-report.md
      - docs/durable-runs.md
      - docs/customer-runner.md
      - docs/customer-ci.md
      - docs/managed-installation.md
      - docs/connection-recipes.md
      - samples/connections/v2-engine-v2-capture/connection.json
      - samples/connections/v2-engine-v2-capture/observation.json
      - samples/connections/v2-application-fhir/connection.json
      - samples/connections/fhir-native-downstream/connection.json
      - runner/readmit-runner.service
      - runner/Dockerfile
      - docs/observe.md
      - docs/test-spec.md
      - docs/test-result.md
      - docs/assertions.md
      - docs/explain.md
      - docs/test-authoring.md
      - docs/suites.md
      - docs/guided-sample.md
      - docs/redact.md
      - docs/support.md
      - docs/workflow-help.md
      - docs/administration.md
      - docs/security-operations.md
      - docs/reproducer.md
      - docs/diff.md
      - docs/drift.md
      - docs/normalize.md
      - docs/baseline.md
      - docs/expectations.md
      - docs/report.md
      - docs/support-matrix.md
      - docs/native-acceptance.md

      - docs/diagnose.md
      - docs/finding-review.md
      - docs/correlate.md
      - docs/transform.md
      - docs/reduction.md
      - docs/selectors.md

      - docs/synth.md
      - docs/synth-v1-vector.md
      - docs/scenario-design.md
      - testdata/README.md
      - testdata/fixtures/*
      - src: internal/dictionary/fields-v251.json
        dst: dictionary
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  # Publication is a separate job after native tests of these exact archives.
  disable: true
