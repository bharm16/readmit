name: Pinned Go with a job-specific cache
description: Check the exact compiler and restore one main build and fuzz cache per job, compiler and dependency set.
inputs:
  cache-scope:
    description: Distinct owner for this job or matrix shard.
    required: true
  cache-dependency-path:
    description: Glob of module checksums; use '**/go.sum' for the desktop module.
    default: go.sum
runs:
  using: composite
  steps:
    - name: Resolve the exact Go compiler pin
      id: toolchain
      shell: bash
      run: echo "version=$(python3 tools/toolchain.py)" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ steps.toolchain.outputs.version }}
        cache: false
    - name: Locate Go caches
      id: paths
      shell: bash
      env:
        PREFIX: go-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-scope }}-${{ steps.toolchain.outputs.version }}-${{ hashFiles(inputs.cache-dependency-path) }}-
        # Bump deliberately after measuring build-time drift. A new epoch is
        # seeded once on main and takes the prior epoch through restore-keys.
        CACHE_EPOCH: stable-1
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
        echo "key=$PREFIX$CACHE_EPOCH" >> "$GITHUB_OUTPUT"
    # Main saves once per compiler/platform/dependency set and epoch. An exact
    # hit skips the post-job save; changed source still compiles against the
    # cached snapshot. Other refs restore main's entry without saving.
    - if: github.ref == 'refs/heads/main'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ steps.paths.outputs.build }}
          ${{ steps.paths.outputs.modules }}
        key: ${{ steps.paths.outputs.key }}
        restore-keys: |
          ${{ steps.paths.outputs.prefix }}
    - if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ steps.paths.outputs.build }}
          ${{ steps.paths.outputs.modules }}
        key: ${{ steps.paths.outputs.key }}
        restore-keys: |
          ${{ steps.paths.outputs.prefix }}
    - name: Verify the active Go compiler
      shell: bash
      run: python3 tools/toolchain.py --check
