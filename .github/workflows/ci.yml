name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Timed fuzz campaigns run here rather than on pull requests: daily, on
  # demand, and for every release tag. These runs also refresh main's caches.
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only newer commits on the same PR cancel a run. Main and tag runs keep
# independent groups, and the desktop workflow cannot cancel this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  READMIT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  # A push to main repeats a pull request's work only when the pull request's
  # run already tested this exact tree and succeeded. The check fails closed:
  # anything short of that proof, an API error included, runs every job.
  proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      proven: ${{ steps.proof.outputs.proven }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Look for a successful pull-request run of this exact tree
        id: proof
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/proven_tree.py --artifact proven-tree-ci

  go-tests:
    needs: proof
    if: ${{ !cancelled() && needs.proof.outputs.proven != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: tests
      - name: Formatting and vet
        run: make check
      - name: Race tests and the production-size resource boundary
        run: make test

  tooling:
    needs: proof
    if: ${{ !cancelled() && needs.proof.outputs.proven != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: tooling
      - name: Release-tool regressions
        run: make test-tools
      - name: Independent endpoints and externally authored corpus
        run: make verify
      - name: Mutation checks
        run: make mutate

  # Timed campaigns never run on a pull request or a push; go-tests runs every
  # target's seed corpus there. Keep this condition identical to TIMED_FUZZ in
  # quality. Each shard starts from the corpus the latest campaigns on main
  # retained, and retains its own, so no cache eviction loses it.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: fuzz-${{ matrix.shard }}
      - name: Restore the corpus the latest campaigns on main retained
        id: corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          corpus="$(go env GOCACHE)/fuzz"
          mkdir -p "$corpus"
          echo "path=$corpus" >> "$GITHUB_OUTPUT"
          for shard in 1 2 3; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=fuzz-corpus-$shard&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .id // empty') || id=
            if [ -z "$id" ]; then
              echo "::warning::no retained corpus for fuzz shard $shard; its targets start from their seeds"
              continue
            fi
            if ! { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/corpus-$shard.zip" &&
                   unzip -o -q "$RUNNER_TEMP/corpus-$shard.zip" -d "$corpus"; }; then
              echo "::warning::the retained corpus of fuzz shard $shard could not be restored"
            fi
          done
          echo "restored $(find "$corpus" -type f | wc -l) corpus entries"
      - name: Discover and fuzz this shard
        run: python3 tools/fuzz.py --shard ${{ matrix.shard }} --shards 3
      - name: Retain the corpus for the next campaign
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-corpus-${{ matrix.shard }}
          path: ${{ steps.corpus.outputs.path }}
          if-no-files-found: warn
          overwrite: true
      - name: Retain the input that failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failure-${{ matrix.shard }}
          path: internal/**/testdata/fuzz/
          overwrite: true

  security:
    needs: proof
    if: ${{ !cancelled() && needs.proof.outputs.proven != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: security
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  # Keep one stable required context. A skipped, cancelled or failed prerequisite
  # must fail this check as well as block release publication.
  hub:
    needs: proof
    if: ${{ !cancelled() && needs.proof.outputs.proven != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: hub
      - name: Isolated PostgreSQL 16 database with local peer authentication
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          sudo install -d -o postgres -g postgres -m 0755 /tmp/readmit-hub-ci
          sudo pg_createcluster 16 readmit --port 55496 --socketdir /tmp/readmit-hub-ci --start -- --auth-local=peer --auth-host=reject
          sudo -u postgres createuser -h /tmp/readmit-hub-ci -p 55496 --no-superuser --no-createdb --no-createrole runner
          sudo -u postgres createdb -h /tmp/readmit-hub-ci -p 55496 --owner=runner readmit_hub_test
      - name: Hub race, transport, recovery and schema tests
        working-directory: hub
        env:
          READMIT_HUB_TEST_SOCKET: /tmp/readmit-hub-ci
          READMIT_HUB_TEST_PORT: '55496'
          READMIT_HUB_TEST_USER: runner
          READMIT_HUB_TEST_BINARY: ./build/package/readmit-hub
        run: |
          test -z "$(gofmt -l .)"
          make package
          export READMIT_HUB_TEST_BINARY="$PWD/build/package/readmit-hub"
          export READMIT_HUB_TEST_BINARY_SHA256="$(sha256sum "$READMIT_HUB_TEST_BINARY" | cut -d ' ' -f 1)"
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readmit-hub-linux-amd64
          path: hub/build/readmit-hub-linux-amd64.tar.gz
          if-no-files-found: error

  quality:
    if: always()
    needs: [proof, go-tests, tooling, fuzz, security, hub]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only a push to main whose tree a pull-request run proved skips its jobs,
      # and then every one of them must have been skipped. Otherwise each must
      # succeed, and timed fuzzing must run exactly on the events it runs for.
      - name: Require every quality job this event runs to succeed
        env:
          PROVEN: ${{ needs.proof.result == 'success' && needs.proof.outputs.proven == 'true' }}
          TIMED_FUZZ: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
          GO_RESULT: ${{ needs.go-tests.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          HUB_RESULT: ${{ needs.hub.result }}
        run: |
          if [ "$PROVEN" = true ]; then expected=skipped; else expected=success; fi
          test "$GO_RESULT" = "$expected"
          test "$TOOLING_RESULT" = "$expected"
          test "$SECURITY_RESULT" = "$expected"
          test "$HUB_RESULT" = "$expected"
          if [ "$TIMED_FUZZ" = true ]; then test "$FUZZ_RESULT" = success; else test "$FUZZ_RESULT" = skipped; fi
      # The record a later push to main looks for. Failing to write it only
      # means that push runs in full, so it never fails this check.
      - name: Record the tree this pull-request run tested
        id: tested
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          test -n "$tree"
          printf '%s\n' "$GITHUB_SHA" > tested-commit.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request' && steps.tested.outputs.tree != ''
        continue-on-error: true
        with:
          name: proven-tree-ci-${{ steps.tested.outputs.tree }}
          path: tested-commit.txt
          if-no-files-found: error
          overwrite: true

  package:
    needs: proof
    if: ${{ !cancelled() && needs.proof.outputs.proven != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: package
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean --skip=publish' || 'release --clean --skip=publish --snapshot' }}
      - name: Verify compiler identity in the exact release archives
        run: python3 tools/smoke.py --artifacts dist --check-build-info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # This job and the two below it name their prerequisites' results rather
  # than rely on the implicit success(), which also fails for the proof job
  # that every event except a push to main skips.
  native-smoke:
    timeout-minutes: 20
    needs: package
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: dist
      - name: Run the archived executable without a toolchain on PATH
        run: python3 tools/smoke.py --artifacts dist --os ${{ matrix.os }} --arch ${{ matrix.arch }}
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: native-acceptance-${{ matrix.os }}-${{ matrix.arch }}
      - name: Require the packaged public CLI journeys without skipped tests
        shell: python
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("tools").resolve()))
          from acceptance import digest, execute
          from smoke import verified_archives
          extension = ".zip" if os.environ["TARGET_OS"] == "windows" else ".tar.gz"
          suffix = "_" + os.environ["TARGET_OS"] + "_" + os.environ["TARGET_ARCH"] + extension
          archives = [p for p in verified_archives(Path("dist")) if p.name.endswith(suffix)]
          if len(archives) != 1:
              raise RuntimeError("expected one native candidate")
          archive = archives[0]
          version = archive.name.removeprefix("readmit_").removesuffix(suffix)
          execute(archive, digest(archive), version, Path("native-acceptance").resolve())
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-acceptance-${{ matrix.os }}-${{ matrix.arch }}
          path: native-acceptance/
          if-no-files-found: error

  publish:
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.quality.result == 'success' && needs.native-smoke.result == 'success' }}
    needs: [quality, native-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: dist
      - name: Extract the verified binaries for provenance
        run: python3 tools/smoke.py --artifacts dist --extract-binaries attested
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: attested/*
      - name: Publish the archives that passed native smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --verify-tag --prerelease --title "readmit $RELEASE_TAG" \
            --notes-file docs/release-notes.md

  download-smoke:
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download the published archive and run it without Go on PATH
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded \
            --pattern '*_linux_amd64.tar.gz' --pattern checksums.txt
          python3 tools/smoke.py --artifacts downloaded --os linux --arch amd64
