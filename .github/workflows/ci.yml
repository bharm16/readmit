name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Only newer commits on the same PR cancel a run. Main and tag runs keep
# independent groups, and the desktop workflow cannot cancel this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  READMIT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  go-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: tests
      - name: Formatting and vet
        run: make check
      - name: Race tests and the production-size resource boundary
        run: make test

  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: tooling
      - name: Release-tool regressions
        run: make test-tools
      - name: Independent endpoints and externally authored corpus
        run: make verify
      - name: Mutation checks
        run: make mutate

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: fuzz-${{ matrix.shard }}
      - name: Discover and fuzz this shard
        run: python3 tools/fuzz.py --shard ${{ matrix.shard }} --shards 3

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: security
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  # Keep one stable required context. A skipped, cancelled or failed prerequisite
  # must fail this check as well as block release publication.
  hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: hub
      - name: Isolated PostgreSQL 16 database with local peer authentication
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          sudo install -d -o postgres -g postgres -m 0755 /tmp/readmit-hub-ci
          sudo pg_createcluster 16 readmit --port 55496 --socketdir /tmp/readmit-hub-ci --start -- --auth-local=peer --auth-host=reject
          sudo -u postgres createuser -h /tmp/readmit-hub-ci -p 55496 --no-superuser --no-createdb --no-createrole runner
          sudo -u postgres createdb -h /tmp/readmit-hub-ci -p 55496 --owner=runner readmit_hub_test
      - name: Hub race, transport, recovery and schema tests
        working-directory: hub
        env:
          READMIT_HUB_TEST_SOCKET: /tmp/readmit-hub-ci
          READMIT_HUB_TEST_PORT: '55496'
          READMIT_HUB_TEST_USER: runner
          READMIT_HUB_TEST_BINARY: ./build/package/readmit-hub
        run: |
          test -z "$(gofmt -l .)"
          make package
          go test -race ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readmit-hub-linux-amd64
          path: hub/build/readmit-hub-linux-amd64.tar.gz
          if-no-files-found: error

  quality:
    if: always()
    needs: [go-tests, tooling, fuzz, security, hub]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          GO_RESULT: ${{ needs.go-tests.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          HUB_RESULT: ${{ needs.hub.result }}
        run: |
          test "$GO_RESULT" = success
          test "$TOOLING_RESULT" = success
          test "$FUZZ_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$HUB_RESULT" = success

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: package
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean --skip=publish' || 'release --clean --skip=publish --snapshot' }}
      - name: Verify compiler identity in the exact release archives
        run: python3 tools/smoke.py --artifacts dist --check-build-info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  native-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: dist
      - name: Run the archived executable without a toolchain on PATH
        run: python3 tools/smoke.py --artifacts dist --os ${{ matrix.os }} --arch ${{ matrix.arch }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, native-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: dist
      - name: Extract the verified binaries for provenance
        run: python3 tools/smoke.py --artifacts dist --extract-binaries attested
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: attested/*
      - name: Publish the archives that passed native smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --verify-tag --prerelease --title "readmit $RELEASE_TAG" \
            --notes-file docs/release-notes.md

  download-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download the published archive and run it without Go on PATH
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded \
            --pattern '*_linux_amd64.tar.gz' --pattern checksums.txt
          python3 tools/smoke.py --artifacts downloaded --os linux --arch amd64
