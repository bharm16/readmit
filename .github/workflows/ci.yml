name: CI and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'
  READMIT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Resolve the exact Go compiler pin
        id: toolchain
        run: |
          pinned_go=$(python3 tools/toolchain.py)
          echo "version=$pinned_go" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - name: Verify the active Go compiler
        run: python3 tools/toolchain.py --check
      - name: Formatting, vet, and tests
        env:
          CGO_ENABLED: '1'
        run: |
          test -z "$(gofmt -l cmd internal tests desktop)"
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          go vet ./...
          go test -race ./...
          go test ./internal/hl7 -run '^$' -fuzz=FuzzParse -fuzztime=15s -parallel=2
          go test ./internal/hl7 -run '^$' -fuzz=FuzzSelector -fuzztime=15s -parallel=2
          go test ./internal/bundle -run '^$' -fuzz=FuzzOpen -fuzztime=15s -parallel=2
          go test ./internal/mllp -run '^$' -fuzz=FuzzFraming -fuzztime=15s -parallel=2
          go test ./internal/collection -run '^$' -fuzz=FuzzPolicy -fuzztime=15s -parallel=2
          go test ./internal/collection -run '^$' -fuzz=FuzzCollection -fuzztime=15s -parallel=2
          go test ./internal/desktop -run '^$' -fuzz=FuzzRecent -fuzztime=15s -parallel=2
      - name: Independent endpoints, externally authored corpus, and mutation checks
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -o "$RUNNER_TEMP/readmit" ./cmd/readmit
          python3 tools/verify.py --binary "$RUNNER_TEMP/readmit"
          python3 tools/mutate.py
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the exact Go compiler pin
        id: toolchain
        run: |
          pinned_go=$(python3 tools/toolchain.py)
          echo "version=$pinned_go" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - name: Verify the active Go compiler
        run: python3 tools/toolchain.py --check
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: ${{ startsWith(github.ref, 'refs/tags/v') && 'release --clean --skip=publish' || 'release --clean --skip=publish --snapshot' }}
      - name: Verify compiler identity in the exact release archives
        run: python3 tools/smoke.py --artifacts dist --check-build-info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  native-smoke:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: dist
      - name: Run the archived executable without a toolchain on PATH
        run: python3 tools/smoke.py --artifacts dist --os ${{ matrix.os }} --arch ${{ matrix.arch }}

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [quality, native-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-candidate
          path: dist
      - name: Extract the verified binaries for provenance
        run: python3 tools/smoke.py --artifacts dist --extract-binaries attested
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: attested/*
      - name: Publish the archives that passed native smoke tests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --verify-tag --prerelease --title "readmit $RELEASE_TAG" \
            --notes-file docs/release-notes.md

  download-smoke:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download the published archive and run it without Go on PATH
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir downloaded \
            --pattern '*_linux_amd64.tar.gz' --pattern checksums.txt
          python3 tools/smoke.py --artifacts downloaded --os linux --arch amd64
