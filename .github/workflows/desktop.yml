name: Desktop shell

# The desktop shell is a separate Go module with cgo and a platform webview. It
# is built here so the static command-line release in ci.yml keeps its own
# build, its own dependency graph, and CGO_ENABLED=0. This workflow packages the
# shell for the finite D5 target matrix and installs each package natively, and
# it publishes nothing: every package it writes is an unsigned development
# preview, and signing identities and credentials never reach it.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Only newer commits on the same PR cancel a run. Main and tag runs keep
# independent groups, and the desktop workflow cannot cancel this workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOTELEMETRY: 'off'

jobs:
  desktop-shell:
    # macOS supplies a webview without extra system packages, so this job
    # exercises the real native build rather than a stub. The built window needs
    # a display, so it is not executed here; the behaviour behind it is covered
    # on both sides of the facade: internal/desktop by the release module's
    # race-enabled suite, and the frontend by the Vitest behavior tests that
    # drive the components against the typed boundary below, and by the
    # interaction journeys that drive the production window against the real
    # facade across that boundary.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: desktop
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Type-check and build the embedded frontend from its lock file
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
      # The behavior tests execute the real components against the typed facade
      # boundary, so they run here — not merely compile: a failing component
      # test fails this job and the desktop aggregate with it. The verbose
      # output is published beside the build output.
      - name: Run the frontend behavior tests against the typed facade boundary
        working-directory: desktop/frontend
        run: |
          set -o pipefail
          npm test -- --reporter=verbose 2>&1 | tee vitest-output.txt
      # The interaction journeys drive the production window with real user
      # events against the real internal/desktop facade over real files, with
      # no stubbed answer: the journeybridge and the command line are built
      # here from this checkout, and a failing journey fails this job and the
      # desktop aggregate. It runs even when a component test failed, so both
      # outputs are published together.
      - name: Run the interaction journeys against the real facade
        if: success() || failure()
        working-directory: desktop/frontend
        run: |
          set -o pipefail
          npm run test:journeys -- --reporter=verbose 2>&1 | tee journeys-output.txt
      - name: Publish the frontend test output beside the build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-frontend-test-output
          path: |
            desktop/frontend/vitest-output.txt
            desktop/frontend/journeys-output.txt
          if-no-files-found: error
      - name: Build the desktop shell against the platform webview
        working-directory: desktop
        env:
          CGO_ENABLED: '1'
        run: |
          go vet -tags production ./...
          go test -tags production ./...
          go build -tags production -o build/readmit-desktop .
      - name: Vulnerability check for the desktop dependency graph
        working-directory: desktop
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck -tags production ./...

  # Native desktop packages for the finite target matrix. Each package is built
  # on the machine it targets, from that machine's own build of the shell, and
  # then installed, checked and removed through the platform's own installer.
  # Every package here is an UNSIGNED development preview: no Developer ID
  # signature, no notarization, no stapling, no Windows code signature. Signing
  # identities and protected credentials are release inputs this workflow never
  # sees, and nothing here publishes a package.
  desktop-package:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache-scope: desktop-package-${{ matrix.os }}-${{ matrix.arch }}
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - name: Install the WebKitGTK development packages the .deb declares
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install the WiX command line that writes the installer database
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.1
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Name this build, which is a development preview and not a release
        shell: bash
        run: echo "READMIT_PREVIEW_VERSION=0.0.0+dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Build the embedded frontend from its lock file
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
      # One stamp for both entry points. The desktop shell and the command line
      # are one engine build, so an installed package and an archive have to
      # report one identity rather than two.
      - name: Build the desktop shell for this target
        working-directory: desktop
        shell: bash
        run: |
          stamp="-X github.com/bharm16/readmit/internal/engine.version=$READMIT_PREVIEW_VERSION"
          # Linux and macOS need cgo for the platform webview. The Windows
          # webview binding is pure Go, so that runner keeps its own default.
          case "${{ matrix.os }}" in
            linux)   CGO_ENABLED=1 go build -tags production,webkit2_41 -trimpath -ldflags "$stamp" -o build/readmit-desktop . ;;
            darwin)  CGO_ENABLED=1 go build -tags production -trimpath -ldflags "$stamp" -o build/readmit-desktop . ;;
            # A window with no console attached still writes to a redirected
            # standard output, which is how its identity is read back.
            windows) go build -tags production -trimpath -ldflags "-H windowsgui $stamp" -o build/readmit-desktop.exe . ;;
          esac
      - name: Build the command line from the same commit and the same stamp
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/bharm16/readmit/internal/engine.version=$READMIT_PREVIEW_VERSION" \
            -o "build/readmit${{ matrix.os == 'windows' && '.exe' || '' }}" ./cmd/readmit
      - name: Build and verify the native packages for this target
        shell: bash
        run: |
          python3 tools/package_desktop.py build \
            --binary "desktop/build/readmit-desktop${{ matrix.os == 'windows' && '.exe' || '' }}" \
            --version "$READMIT_PREVIEW_VERSION" --output dist-desktop \
            --os ${{ matrix.os }} --arch ${{ matrix.arch }}
          python3 tools/package_desktop.py verify --packages dist-desktop
      # Build provenance for the packages this run produced. It records which
      # workflow built them from which commit; it is not a code signature and
      # makes no claim that the packages are signed, notarized or published.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist-desktop/readmit-desktop_*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-preview-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist-desktop/manifest.json
            dist-desktop/readmit-desktop_*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-install-cli-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          path: build/readmit*

  # Fresh runners download the artifacts; no Go/Node/WiX build setup here.
  # Hosted images still contain developer tools. Empty-PATH execution is a
  # bounded headless check, not clean managed-machine or interactive acceptance.
  desktop-install:
    needs: desktop-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, runner: ubuntu-24.04}
          - {os: linux, arch: arm64, runner: ubuntu-24.04-arm}
          - {os: darwin, arch: amd64, runner: macos-15-intel}
          - {os: darwin, arch: arm64, runner: macos-15}
          - {os: windows, arch: amd64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: desktop-preview-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-desktop
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: desktop-install-cli-${{ matrix.os }}-${{ matrix.arch }}
          path: build
      - name: Verify downloaded packages and create synthetic retention markers
        shell: bash
        run: |
          echo "READMIT_PREVIEW_VERSION=0.0.0+dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          chmod +x build/readmit* || exit 1
          python3 tools/package_desktop.py verify --packages dist-desktop
          mkdir -p "$HOME/readmit-install-retention/project" "$HOME/readmit-install-retention/state"
          printf 'synthetic evidence retained\n' > "$HOME/readmit-install-retention/project/marker.txt"
          printf 'synthetic state retained\n' > "$HOME/readmit-install-retention/state/marker.txt"
      - name: Install declared runtime dependencies only
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 xvfb xauth
      - name: Install, check and remove the .deb through the platform's own tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get install -y ./dist-desktop/readmit-desktop_*.deb
          dpkg -s readmit-desktop | grep -q '^Status: install ok installed'
          test -f /usr/share/applications/readmit-desktop.desktop
          # Running the installed executable resolves every library it links
          # against, so a wrong or missing declared dependency fails here. No
          # window is opened for this identity check. The next check uses Xvfb
          # to initialize the installed native webview without a physical display.
          python3 tools/package_desktop.py installed \
            --desktop /usr/bin/readmit-desktop --command-line build/readmit \
            --resources /usr/share/doc/readmit-desktop --version "$READMIT_PREVIEW_VERSION"
          xvfb-run -a python3 tools/package_desktop.py startup --desktop /usr/bin/readmit-desktop
          sudo apt-get remove -y readmit-desktop
          test ! -e /usr/bin/readmit-desktop
      - name: Install, check and remove the macOS packages through their own tools
        if: matrix.os == 'darwin'
        run: |
          # The disk image is what a person opens and drags across.
          mkdir mounted
          hdiutil attach -nobrowse -readonly -mountpoint mounted dist-desktop/*.dmg
          cp -R mounted/readmit-desktop.app /Applications/
          hdiutil detach mounted
          python3 tools/package_desktop.py installed \
            --desktop /Applications/readmit-desktop.app/Contents/MacOS/readmit-desktop \
            --command-line build/readmit \
            --resources /Applications/readmit-desktop.app/Contents/Resources --version "$READMIT_PREVIEW_VERSION"
          python3 tools/package_desktop.py startup --desktop /Applications/readmit-desktop.app/Contents/MacOS/readmit-desktop
          rm -rf /Applications/readmit-desktop.app
          # The installer package is what a managed installation runs.
          sudo installer -pkg dist-desktop/*.pkg -target /
          # A preview must not be mistaken for an application signed for
          # distribution. Apple silicon requires every executable to carry an
          # ad-hoc signature, which the linker applies, so codesign succeeds on
          # any arm64 build; only a named signing authority marks a real one,
          # and it is printed at -dvv and not at -dv.
          reported=$(codesign -dvv /Applications/readmit-desktop.app 2>&1 || true)
          if printf '%s\n' "$reported" | grep -q '^Authority='; then
            echo "this preview is signed for distribution, which it was not built to be:" >&2
            printf '%s\n' "$reported" | grep '^Authority=' >&2
            exit 1
          fi
          python3 tools/package_desktop.py installed \
            --desktop /Applications/readmit-desktop.app/Contents/MacOS/readmit-desktop \
            --command-line build/readmit \
            --resources /Applications/readmit-desktop.app/Contents/Resources --version "$READMIT_PREVIEW_VERSION"
          python3 tools/package_desktop.py startup --desktop /Applications/readmit-desktop.app/Contents/MacOS/readmit-desktop
          sudo rm -rf /Applications/readmit-desktop.app
          test ! -e /Applications/readmit-desktop.app
      - name: Install, check and remove the MSI silently, as managed deployment does
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem dist-desktop\*.msi).FullName
          $installed = 'C:\Program Files\readmit\readmit-desktop.exe'
          if ((Get-AuthenticodeSignature $installer).Status -ne 'NotSigned') {
            throw "preview MSI unexpectedly carries signature material"
          }
          $install = Start-Process msiexec -ArgumentList "/i `"$installer`" /qn /norestart /l*v install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "silent install failed: $($install.ExitCode)" }
          if (-not (Test-Path $installed)) { throw "the installer wrote no application" }
          # Windows Installer read the database's own tables: the launch
          # condition searched the registry for the WebView2 runtime, and the
          # verbose log records the property it resolved.
          if (-not (Select-String -Path install.log -Pattern 'READMITWEBVIEW2' -Quiet)) {
            throw "the installer never evaluated the WebView2 prerequisite"
          }
          python tools\package_desktop.py installed --desktop "$installed" --command-line build\readmit.exe --resources "C:\Program Files\readmit" --version "$env:READMIT_PREVIEW_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "installed payload verification failed" }
          python tools\package_desktop.py startup --desktop "$installed"
          if ($LASTEXITCODE -ne 0) { throw "native webview startup failed" }
          if ((Get-AuthenticodeSignature $installed).Status -ne 'NotSigned') {
            throw "preview executable unexpectedly carries signature material"
          }
          $remove = Start-Process msiexec -ArgumentList "/x `"$installer`" /qn /norestart" -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "silent removal failed: $($remove.ExitCode)" }
          if (Test-Path $installed) { throw "removal left the application behind" }
      - name: Removal preserved synthetic evidence and local state
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          root = Path.home() / "readmit-install-retention"
          assert (root / "project/marker.txt").read_bytes() == b"synthetic evidence retained\n"
          assert (root / "state/marker.txt").read_bytes() == b"synthetic state retained\n"
          PYTHON

  # Keep one stable required context for this workflow, the way ci.yml keeps
  # `quality`. A skipped, cancelled or failed prerequisite must fail this check,
  # so no other worktree has to guess which desktop job names are mandatory.
  desktop:
    if: always()
    needs: [desktop-shell, desktop-package, desktop-install]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shell build and every native package to succeed
        env:
          SHELL_RESULT: ${{ needs.desktop-shell.result }}
          PACKAGE_RESULT: ${{ needs.desktop-package.result }}
          INSTALL_RESULT: ${{ needs.desktop-install.result }}
        run: |
          test "$SHELL_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$INSTALL_RESULT" = success
