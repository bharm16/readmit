name: Repair Readmit issue execution metadata

on:
  push:
    branches: ['maintenance/readmit-backlog-execution-20260918']
    paths: ['.github/workflows/repair-readmit-backlog.yml']

permissions:
  contents: read
  issues: write

concurrency:
  group: readmit-backlog-execution-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'bharm16/readmit'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PROMPT_DISABLED: '1'
    steps:
      - name: Load the reviewed, immutable issue-only repair script
        shell: bash
        run: |
          set -euo pipefail
          gh api --hostname github.com \
            'repos/bharm16/readmit/contents/tools/repair_product_issue_metadata.py?ref=51a2b29d35e1eb03c6c04ffc4e4629c7b9939032' \
            --jq .content | base64 --decode > "$RUNNER_TEMP/readmit_issue_repair.py"
          python3 - <<'PY'
          import ast, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'readmit_issue_repair.py'
          text = path.read_text()
          needle = '    if len(areas) != 24:\n'
          assert text.count(needle) == 1
          extra = '''    # Some source areas use inline prose rather than details blocks.
              # Reuse only existing roadmap text; do not synthesize missing scope.
              for match in re.finditer(r'(?ms)^### (R\\d{2})[^\\n]*\\n(.*?)(?=^### R\\d{2}|^## |\\Z)', roadmap['body']):
                  pid, section = match.group(1), match.group(2)
                  if pid in areas:
                      continue
                  if pid == 'R18':
                      areas[pid] = 'Only the already imported requirements in #93, #94 and #95 are available here. R18.1 remains unimported and unresolved; this repair does not copy or recreate its blocked content. See each issue and its information gate.'
                  else:
                      retained = '\\n'.join(line for line in section.splitlines() if not line.startswith('- [ ]')).strip()
                      if not retained:
                          raise RuntimeError(f'No source product context for {pid}')
                      areas[pid] = retained
          '''
          text = text.replace(needle, extra + needle)
          ast.parse(text)
          path.write_text(text)
          PY
      - name: Validate graph, add native blockers, triage and verify existing issues
        shell: bash
        run: python3 "$RUNNER_TEMP/readmit_issue_repair.py"
      - name: Retain the verified dependency manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readmit-issue-execution-verification
          path: verification.json
          if-no-files-found: error
          retention-days: 14
